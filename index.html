<!DOCTYPE html>
<html>
<head>
<title>Indian Services</title>
<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 15px cyan;
}

.price{
color:#22c55e;
font-size:22px;
font-weight:bold;
}

button{
margin-top:15px;
padding:10px 15px;
background:cyan;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#22c55e;
}
</style>
</head>

<body>

<h1 align="center">🚀 Our Services</h1>

<div class="container">

<div class="card">
<h2>WordPress Website</h2>
<p>Business, Blog, Portfolio with SEO</p>
<p class="price">₹5,999+</p>
<button>Order Now</button>
</div>

<div class="card">
<h2>AI Agent Development</h2>
<p>Chatbot, Automation, Code Generator</p>
<p class="price">₹9,999+</p>
<button>Get AI Agent</button>
</div>

<div class="card">
<h2>E-Commerce Website</h2>
<p>Online Store with Payment</p>
<p class="price">₹12,999+</p>
<button>Start Store</button>
</div>

<div class="card">
<h2>Basic Website</h2>
<p>Simple fast website 1-5 pages</p>
<p class="price">₹2,999+</p>
<button>Build Now</button>
</div>

</div>

<script>
const buttons=document.querySelectorAll("button");

buttons.forEach(btn=>{
btn.onclick=()=>{
alert("Thank you! We will contact you soon 🚀");
}
})
</script>

</body>
</html>
